<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>바건 Bargain</title>
<meta name="description" content="바다 건너 사고파는 중고거래, 바건">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: harbor board — sticky header, wrap-grid of parcel-tag cards, bottom sheet for posting */
:root {
  --bg: #EDF3F3; --surface: #FFFFFF; --ink: #0F2A3A; --muted: #587080; --line: #D2DEE0;
  --sea: #1D5C7A; --accent: #E25A22; --accent-ink: #FFFFFF; --danger: #B42318; --shade: rgba(15, 42, 58, .45);
  --f-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0A161D; --surface: #11222C; --ink: #E4EDEF; --muted: #93A8B2; --line: #233945;
    --sea: #74B6D2; --accent: #F2753F; --accent-ink: #1A0B03; --danger: #F97066; --shade: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
header.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 12px; }
.logo { display: flex; align-items: baseline; gap: 8px; }
.logo b { font-family: var(--f-display); font-weight: 400; font-size: 28px; letter-spacing: .02em; color: var(--sea); line-height: 1; }
.logo span { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; color: var(--muted); }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 700; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn-sea { background: var(--sea); color: var(--surface); }
.btn-danger { background: var(--danger); color: var(--surface); }
.btn[disabled] { opacity: .55; cursor: default; }
.btn svg { width: 18px; height: 18px; flex: none; }

.hero { padding-block: 28px 8px; display: grid; gap: 6px; }
.hero h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(26px, 5vw, 38px); line-height: 1.2; margin: 0; text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p { margin: 0; color: var(--muted); max-width: 60ch; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--sea); border-color: var(--sea); color: var(--surface); }
.chip .code { font-family: var(--f-mono); font-size: 12px; margin-right: 4px; opacity: .8; }

.notice { margin-block: 4px 12px; padding: 10px 14px; border-radius: 10px; background: var(--surface); border: 1px dashed var(--accent); color: var(--ink); font-size: 14px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; padding-block: 4px 48px; }
@media (max-width: 480px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } }

.card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; text-align: left; padding: 0; min-width: 0; }
.card .ph { position: relative; aspect-ratio: 4 / 3; max-width: 100%; background: var(--line); }
.card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tag { position: absolute; left: 10px; top: 10px; display: inline-flex; align-items: center; gap: 6px; background: var(--surface); color: var(--ink); border-radius: 6px; padding: 3px 8px 3px 6px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; }
.tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.card .body { display: grid; gap: 2px; padding: 10px 12px 12px; min-width: 0; }
.card .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.price { font-family: var(--f-mono); font-weight: 500; font-size: 16px; font-variant-numeric: tabular-nums; }
.meta { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.empty { grid-column: 1 / -1; display: grid; justify-items: center; gap: 10px; text-align: center; padding: 48px 16px; border: 1px dashed var(--line); border-radius: 16px; color: var(--muted); }
.empty svg { width: 64px; height: 64px; color: var(--sea); }
.empty strong { color: var(--ink); font-size: 17px; }

.overlay { position: fixed; inset: 0; z-index: 20; background: var(--shade); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--surface); border-radius: 20px 20px 0 0; padding: 20px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
.sheet > * { flex: none; }
@media (min-width: 700px) { .overlay { align-items: center; } .sheet { border-radius: 20px; } }
.sheet-head { display: flex; align-items: center; gap: 12px; }
.sheet-head h2 { margin: 0; font-size: 19px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.x { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
.x svg { width: 20px; height: 20px; }

.pick { position: relative; display: grid; place-items: center; aspect-ratio: 4 / 3; max-width: 100%; border: 2px dashed var(--line); border-radius: 14px; overflow: hidden; color: var(--muted); text-align: center; }
.pick.over { border-color: var(--accent); }
.pick img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pick .hint { display: grid; gap: 6px; justify-items: center; padding: 12px; }
.pick .hint svg { width: 40px; height: 40px; color: var(--accent); }
.pick-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick-btns .btn { justify-content: center; padding: 12px 10px; }
.file-btn { position: relative; overflow: hidden; }
.file-btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.file-btn input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 100px; }

.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-size: 13px; font-weight: 500; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.field textarea { min-height: 84px; resize: vertical; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.err { color: var(--danger); font-size: 14px; margin: 0; }

.detail-img { width: 100%; border-radius: 12px; display: block; background: var(--line); aspect-ratio: 4 / 3; object-fit: contain; }
.detail-price { font-family: var(--f-mono); font-size: 22px; font-weight: 500; }
.detail-desc { white-space: pre-wrap; margin: 0; overflow-wrap: anywhere; }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px; border-radius: 10px; border: 1px solid var(--danger); }
.confirm p { margin: 0; flex: 1 1 160px; }

@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="logo"><b>바건</b><span>BARGAIN</span></div>
    <div class="spacer"></div>
    <button class="btn btn-primary" id="openPost" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      사진 올리기
    </button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>바다 건너, <em>더 싸게</em> 사고팔기</h1>
    <p>물건 사진을 찍어 올리면 다른 나라 사람들도 볼 수 있어요. 나라를 골라서 어디서 온 물건인지 확인해 보세요.</p>
  </section>
  <div class="chips" id="chips" role="group" aria-label="판매 국가로 거르기"></div>
  <p class="notice" id="notice" hidden></p>
  <section class="grid" id="grid" aria-live="polite">
    <div class="empty">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 44c5 0 5 4 10 4s5-4 10-4 5 4 10 4 5-4 10-4 5 4 10 4"/><path d="M14 38l4-14h28l4 14"/><path d="M24 24v-8h16v8"/></svg>
      <strong>상품을 불러오는 중이에요</strong>
      <span>잠시만 기다려 주세요.</span>
    </div>
  </section>
</main>

<div class="overlay" id="postOverlay" hidden>
  <form class="sheet" id="postForm" novalidate>
    <div class="sheet-head">
      <h2>상품 올리기</h2>
      <button class="x" type="button" data-close aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="pick" id="dropZone">
      <img id="preview" alt="선택한 사진 미리보기" hidden>
      <span class="hint" id="pickHint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <strong>상품 사진을 넣어 주세요</strong>
        <span>아래 버튼으로 찍거나 골라요</span>
      </span>
    </div>
    <div class="pick-btns">
      <div class="btn btn-sea file-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <span id="camLabel">카메라로 찍기</span>
        <input id="photoCam" type="file" accept="image/*" capture="environment" aria-label="카메라로 찍기">
      </div>
      <div class="btn btn-ghost file-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
        <span>앨범에서 고르기</span>
        <input id="photoLib" type="file" accept="image/*" aria-label="앨범에서 고르기">
      </div>
    </div>
    <div class="field">
      <label for="title">상품 이름</label>
      <input id="title" maxlength="60" placeholder="예: 일본 한정판 필름 카메라" autocomplete="off">
    </div>
    <div class="row">
      <div class="field">
        <label for="country">파는 나라</label>
        <select id="country"></select>
      </div>
      <div class="field">
        <label for="currency">통화</label>
        <select id="currency"></select>
      </div>
    </div>
    <div class="field">
      <label for="price">가격</label>
      <input id="price" inputmode="decimal" placeholder="숫자만 입력" autocomplete="off">
    </div>
    <div class="field">
      <label for="seller">올리는 사람 이름 <span style="font-weight:400">(선택)</span></label>
      <input id="seller" maxlength="20" placeholder="예: 바건팀 승현" autocomplete="nickname">
    </div>
    <div class="field">
      <label for="desc">설명 <span style="font-weight:400">(선택)</span></label>
      <textarea id="desc" maxlength="600" placeholder="상태, 구성품, 배송 방법 등을 적어 주세요"></textarea>
    </div>
    <p class="err" id="postErr" hidden></p>
    <button class="btn btn-primary" id="submitBtn" type="submit" style="justify-content:center">올리기</button>
  </form>
</div>

<div class="overlay" id="detailOverlay" hidden>
  <div class="sheet" id="detail" role="dialog" aria-modal="true" aria-labelledby="dTitle"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, query, orderBy, limit, onSnapshot, getDoc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBG0-kcrU9W2p9bS3VzaBHpKcdq7mDnm-k",
  authDomain: "bargain-2f698.firebaseapp.com",
  projectId: "bargain-2f698",
  storageBucket: "bargain-2f698.firebasestorage.app",
  messagingSenderId: "160856967613",
  appId: "1:160856967613:web:58def85be6354f191e2ad4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const COUNTRIES = [
  { code: "KR", name: "한국", cur: "KRW" }, { code: "JP", name: "일본", cur: "JPY" },
  { code: "CN", name: "중국", cur: "CNY" }, { code: "US", name: "미국", cur: "USD" },
  { code: "VN", name: "베트남", cur: "VND" }, { code: "TW", name: "대만", cur: "TWD" },
  { code: "GB", name: "영국", cur: "GBP" }, { code: "FR", name: "프랑스", cur: "EUR" },
  { code: "DE", name: "독일", cur: "EUR" }, { code: "ETC", name: "기타", cur: "USD" }
];
const CURRENCIES = ["KRW", "JPY", "CNY", "USD", "VND", "TWD", "GBP", "EUR"];
const byCode = Object.fromEntries(COUNTRIES.map(c => [c.code, c]));
const $ = id => document.getElementById(id);
const state = { items: [], filter: "ALL", uid: null, file: null };

// ---------- helpers ----------
function fmtPrice(n, cur) {
  try { return new Intl.NumberFormat("ko-KR", { style: "currency", currency: cur, maximumFractionDigits: ["KRW", "JPY", "VND"].includes(cur) ? 0 : 2 }).format(n); }
  catch { return n + " " + cur; }
}
function ago(ms) {
  if (!ms) return "방금";
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 60) return "방금";
  if (s < 3600) return Math.floor(s / 60) + "분 전";
  if (s < 86400) return Math.floor(s / 3600) + "시간 전";
  return Math.floor(s / 86400) + "일 전";
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function showNotice(msg) { const n = $("notice"); n.textContent = msg || ""; n.hidden = !msg; }
const isImgData = s => typeof s === "string" && /^data:image\/(jpeg|png|webp);base64,/.test(s);

// Load the photo and redraw it as a JPEG data URL no wider/taller than `max`,
// lowering quality until it fits under `maxChars` (Firestore documents are capped at 1 MiB).
async function loadImage(file) {
  const url = URL.createObjectURL(file);
  try {
    return await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("decode")); i.src = url; });
  } finally { setTimeout(() => URL.revokeObjectURL(url), 1000); }
}
function toJpeg(img, max, maxChars) {
  let scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  for (let tries = 0; tries < 8; tries++) {
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.naturalWidth * scale));
    c.height = Math.max(1, Math.round(img.naturalHeight * scale));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    for (const q of [0.82, 0.7, 0.58, 0.46]) {
      const d = c.toDataURL("image/jpeg", q);
      if (d.length <= maxChars) return d;
    }
    scale *= 0.75;
  }
  throw new Error("too_big");
}

// ---------- chips ----------
function renderChips() {
  const box = $("chips"); box.textContent = "";
  const present = new Set(state.items.map(i => i.country));
  if (state.filter !== "ALL" && !present.has(state.filter)) state.filter = "ALL";
  const opts = [{ code: "ALL", name: "전체" }].concat(COUNTRIES.filter(c => present.has(c.code)));
  for (const c of opts) {
    const b = el("button", "chip"); b.type = "button";
    b.setAttribute("aria-pressed", String(state.filter === c.code));
    if (c.code !== "ALL") b.appendChild(el("span", "code", c.code));
    b.appendChild(document.createTextNode(c.name));
    b.onclick = () => { state.filter = c.code; renderChips(); renderGrid(); };
    box.appendChild(b);
  }
}

// ---------- grid ----------
const EMPTY_ICON = '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 44c5 0 5 4 10 4s5-4 10-4 5 4 10 4 5-4 10-4 5 4 10 4"/><path d="M14 38l4-14h28l4 14"/><path d="M24 24v-8h16v8"/></svg>';
function renderGrid() {
  const grid = $("grid"); grid.textContent = "";
  const list = state.items.filter(i => state.filter === "ALL" || i.country === state.filter);
  if (!list.length) {
    const e = el("div", "empty"); e.innerHTML = EMPTY_ICON;
    e.appendChild(el("strong", null, state.items.length ? "이 나라 상품은 아직 없어요" : "아직 올라온 상품이 없어요"));
    e.appendChild(el("span", null, "오른쪽 위 '사진 올리기'를 눌러 첫 상품을 올려 보세요."));
    grid.appendChild(e);
    return;
  }
  for (const it of list) {
    const card = el("button", "card"); card.type = "button";
    const ph = el("div", "ph");
    if (it.thumb) { const img = el("img"); img.alt = it.title; img.loading = "lazy"; img.src = it.thumb; ph.appendChild(img); }
    ph.appendChild(el("span", "tag", "FROM " + it.country));
    card.appendChild(ph);
    const body = el("div", "body");
    body.appendChild(el("div", "title", it.title));
    body.appendChild(el("div", "price", fmtPrice(it.price, it.currency)));
    const c = byCode[it.country];
    body.appendChild(el("div", "meta", (c ? c.name : "기타") + " · " + (it.seller || "익명") + " · " + ago(it.createdAt)));
    card.appendChild(body);
    card.onclick = () => openDetail(it);
    grid.appendChild(card);
  }
}

// ---------- detail ----------
function openDetail(it) {
  const d = $("detail"); d.textContent = "";
  const head = el("div", "sheet-head");
  const h = el("h2", null, it.title); h.id = "dTitle"; head.appendChild(h);
  const x = el("button", "x"); x.type = "button"; x.setAttribute("aria-label", "닫기");
  x.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  x.onclick = closeDetail; head.appendChild(x); d.appendChild(head);

  const img = el("img", "detail-img"); img.alt = it.title; if (it.thumb) img.src = it.thumb; d.appendChild(img);
  getDoc(doc(db, "photos", it.id)).then(s => {
    const v = s.exists() ? s.data() : null;
    if (v && isImgData(v.data)) img.src = v.data;
  }).catch(() => {});

  d.appendChild(el("div", "detail-price", fmtPrice(it.price, it.currency)));
  const c = byCode[it.country];
  d.appendChild(el("div", "meta", (c ? c.name + " (" + c.code + ")" : "기타") + "에서 판매 · " + (it.seller || "익명") + " · " + ago(it.createdAt)));
  if (it.desc) d.appendChild(el("p", "detail-desc", it.desc));

  if (state.uid && it.owner === state.uid) {
    const del = el("button", "btn btn-ghost", "이 상품 내리기"); del.type = "button";
    del.onclick = () => {
      del.hidden = true;
      const box = el("div", "confirm");
      box.appendChild(el("p", null, "사진과 정보가 모두 지워져요. 내릴까요?"));
      const yes = el("button", "btn btn-danger", "내리기"); yes.type = "button";
      const no = el("button", "btn btn-ghost", "취소"); no.type = "button";
      no.onclick = () => { box.remove(); del.hidden = false; };
      yes.onclick = async () => {
        yes.disabled = no.disabled = true;
        try {
          const b = writeBatch(db);
          b.delete(doc(db, "listings", it.id));
          b.delete(doc(db, "photos", it.id));
          await b.commit();
          closeDetail();
        } catch {
          box.querySelector("p").textContent = "지우지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.";
          yes.disabled = no.disabled = false;
        }
      };
      box.append(yes, no); d.appendChild(box);
    };
    d.appendChild(del);
  }
  $("detailOverlay").hidden = false;
  x.focus();
}
function closeDetail() { $("detailOverlay").hidden = true; }
$("detailOverlay").addEventListener("click", e => { if (e.target.id === "detailOverlay") closeDetail(); });

// ---------- post form ----------
const countrySel = $("country"), curSel = $("currency");
for (const c of COUNTRIES) { const o = el("option", null, c.name + " (" + c.code + ")"); o.value = c.code; countrySel.appendChild(o); }
for (const cur of CURRENCIES) { const o = el("option", null, cur); o.value = cur; curSel.appendChild(o); }
countrySel.value = "KR"; curSel.value = "KRW";
countrySel.onchange = () => { curSel.value = byCode[countrySel.value].cur; };

let savedSeller = "";
try { savedSeller = localStorage.getItem("bargain.seller") || ""; } catch {}

function fail(msg) { const e = $("postErr"); e.textContent = msg; e.hidden = false; }
function resetForm() {
  $("postForm").reset(); state.file = null;
  $("preview").hidden = true; $("preview").removeAttribute("src"); $("pickHint").hidden = false;
  $("pickHint").querySelector("strong").textContent = "상품 사진을 넣어 주세요";
  $("camLabel").textContent = "카메라로 찍기";
  countrySel.value = "KR"; curSel.value = "KRW"; $("postErr").hidden = true;
  $("seller").value = savedSeller;
}
$("openPost").onclick = () => { resetForm(); $("postOverlay").hidden = false; };
function closePost() { $("postOverlay").hidden = true; }
document.querySelectorAll("[data-close]").forEach(b => b.onclick = closePost);
$("postOverlay").addEventListener("click", e => { if (e.target.id === "postOverlay") closePost(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { closePost(); closeDetail(); } });

let previewUrl = null;
function useFile(f) {
  if (!f) return;
  if (f.type && !f.type.startsWith("image/")) return fail("사진 파일만 올릴 수 있어요.");
  $("postErr").hidden = true;
  state.file = f;
  if (previewUrl) { try { URL.revokeObjectURL(previewUrl); } catch {} }
  previewUrl = URL.createObjectURL(f);
  const p = $("preview");
  p.onerror = () => { p.hidden = true; $("pickHint").hidden = false; $("pickHint").querySelector("strong").textContent = "사진을 골랐어요 (미리보기는 안 돼요)"; };
  p.src = previewUrl; p.hidden = false; $("pickHint").hidden = true;
  $("camLabel").textContent = "다시 찍기";
}
for (const id of ["photoCam", "photoLib"]) {
  const input = $(id);
  input.addEventListener("click", () => { input.value = ""; });
  input.addEventListener("change", () => useFile(input.files && input.files[0]));
}
const dz = $("dropZone");
dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("over"); });
dz.addEventListener("dragleave", () => dz.classList.remove("over"));
dz.addEventListener("drop", e => { e.preventDefault(); dz.classList.remove("over"); useFile(e.dataTransfer.files && e.dataTransfer.files[0]); });
document.addEventListener("paste", e => {
  if ($("postOverlay").hidden) return;
  const item = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.type.startsWith("image/"));
  if (item) { e.preventDefault(); useFile(item.getAsFile()); }
});

$("postForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("postErr").hidden = true;
  const title = $("title").value.trim();
  const price = Number(String($("price").value).replace(/[,\s]/g, ""));
  const seller = $("seller").value.trim().slice(0, 20);
  const desc = $("desc").value.trim().slice(0, 600);
  if (!state.file) return fail("사진을 먼저 찍거나 골라 주세요.");
  if (!title) return fail("상품 이름을 적어 주세요.");
  if (!isFinite(price) || price <= 0) return fail("가격은 0보다 큰 숫자로 적어 주세요.");
  if (!state.uid) return fail("아직 서버에 연결되지 않았어요. 잠시 뒤 다시 눌러 주세요.");

  const btn = $("submitBtn"); btn.disabled = true; btn.textContent = "사진 줄이는 중…";
  try {
    let img;
    try { img = await loadImage(state.file); }
    catch { throw Object.assign(new Error("decode"), { code: "decode" }); }
    const thumb = toJpeg(img, 480, 90000);
    const full = toJpeg(img, 1280, 850000);
    btn.textContent = "올리는 중…";
    const ref = doc(collection(db, "listings"));
    const b = writeBatch(db);
    b.set(ref, { title, price, currency: curSel.value, country: countrySel.value, seller, desc, thumb, owner: state.uid, createdAt: serverTimestamp() });
    b.set(doc(db, "photos", ref.id), { data: full, owner: state.uid });
    await b.commit();
    try { localStorage.setItem("bargain.seller", seller); savedSeller = seller; } catch {}
    closePost();
  } catch (err) {
    const code = err && (err.code || err.message);
    if (code === "decode") fail("이 사진은 열 수 없어요. 다른 사진이나 JPG 사진으로 해 주세요.");
    else if (code === "too_big") fail("사진을 충분히 줄이지 못했어요. 다른 사진으로 해 주세요.");
    else if (code === "permission-denied") fail("서버가 저장을 거절했어요. Firestore 보안 규칙이 적용됐는지 확인해 주세요.");
    else fail("올리지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.");
  } finally { btn.disabled = false; btn.textContent = "올리기"; }
});

// ---------- boot ----------
renderChips();
onAuthStateChanged(auth, user => { state.uid = user ? user.uid : null; });
signInAnonymously(auth).catch(err => {
  if (err && err.code === "auth/operation-not-allowed") showNotice("Firebase에서 익명 로그인이 꺼져 있어요. Authentication → 로그인 방법에서 '익명'을 켜 주세요.");
  else showNotice("서버에 연결하지 못했어요. 새로고침해 주세요.");
});

onSnapshot(query(collection(db, "listings"), orderBy("createdAt", "desc"), limit(120)), snap => {
  state.items = snap.docs.map(d => {
    const v = d.data({ serverTimestamps: "estimate" }) || {};
    return {
      id: d.id,
      title: String(v.title || "이름 없음").slice(0, 60),
      price: Number(v.price) || 0,
      currency: CURRENCIES.includes(v.currency) ? v.currency : "KRW",
      country: byCode[v.country] ? v.country : "ETC",
      seller: String(v.seller || "").slice(0, 20),
      desc: String(v.desc || "").slice(0, 600),
      thumb: isImgData(v.thumb) ? v.thumb : "",
      owner: String(v.owner || ""),
      createdAt: v.createdAt && v.createdAt.toMillis ? v.createdAt.toMillis() : 0
    };
  });
  if (!$("notice").textContent.startsWith("Firebase")) showNotice("");
  renderChips(); renderGrid();
}, err => {
  if (err && err.code === "permission-denied") showNotice("상품을 불러올 권한이 없어요. Firestore 보안 규칙을 확인해 주세요.");
  else if (err && err.code === "failed-precondition") showNotice("Firestore 데이터베이스가 아직 만들어지지 않은 것 같아요.");
  else showNotice("상품 목록을 불러오지 못했어요. 새로고침해 주세요.");
  renderGrid();
});
</script>
</body>
</html>
